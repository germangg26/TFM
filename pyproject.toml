readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "camelot-py>=1.0.9",
    "fastapi>=0.137.1",
    "hdbscan>=0.8.44",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "lightgbm>=4.6.0",
    "nbconvert>=7.17.1",
    "nbstripout>=0.9.1",
    "numpy>=2.4.4",
    "openai>=2.37.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "prophet>=1.3.0",
    "pyjanitor>=0.32.23",
    "rapidfuzz>=3.14.5",
    "ruff>=0.15.13",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.5.1",
    "statsmodels>=0.14.6",
    "tensorflow>=2.21.0",
    "umap-learn>=0.5.12",
    "uvicorn>=0.49.0",
]
